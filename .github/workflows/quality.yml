name: Quality Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不写 version，让 action 读取 package.json 的 packageManager 字段，与本地版本保持一致
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and typecheck
        run: pnpm check

      - name: Run tests
        run: pnpm test

      # 上一步 pnpm check 已跑过 vue-tsc，这里直接 vite build 避免重复类型检查
      - name: Build
        run: pnpm exec vite build
